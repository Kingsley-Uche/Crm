]name: Laravel Deploy via Git Pull

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BASE_DEPLOY_PATH: /home2/netporta/public_html/dwello.netportal.com.ng

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets (Vite)
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - tap
          - woc
          - oaa
          - toc
          - wac

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Upload Vite Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/*"
          target: "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}/public/build"

      - name: Deploy Laravel Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

            echo "Deploying ${{ matrix.app }}..."

            cd "$APP_DIR"

            # 1. Ensure this is a Git repository
            if [ ! -d ".git" ]; then
              echo "ERROR: $APP_DIR is not a Git repository."
              exit 1
            fi

            # 2. Ensure Laravel required directories exist
            mkdir -p bootstrap/cache
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            chmod -R 775 storage bootstrap/cache || true

            # 3. Update code from Git
            git fetch origin
            git reset --hard origin/main

            # 4. Maintenance mode (safe fallback)
            php artisan down || true

            # 5. Install PHP dependencies
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            # 6. Laravel optimization
            php artisan optimize:clear
            php artisan optimize

            # 7. Bring application back online
            php artisan up || true

            echo "${{ matrix.app }} deployed successfully."
