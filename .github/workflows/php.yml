name: Laravel Deploy via Git Pull

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BASE_DEPLOY_PATH: /home2/netporta/public_html/dwello.netportal.com.ng

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - tap
          - woc
          - oaa
          - toc
          - wac

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Upload Compiled Assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/*"
          target: "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}/public/build"

      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

            cd "$APP_DIR"

            echo "Deploying ${{ matrix.app }}..."

            php artisan down || true

            git fetch origin
            git reset --hard origin/main

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            php artisan optimize:clear
            php artisan optimize

            php artisan up || true

            echo "${{ matrix.app }} deployed successfully."
