name: Laravel Build & Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BASE_DEPLOY_PATH: /home2/netporta/public_html/dwello.netportal.com.ng

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, xml, bcmath, fileinfo

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Remove unwanted files
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf node_modules
          rm -rf tests
          rm -rf storage/logs/*
          rm -rf bootstrap/cache/*
          rm -f .env

      - name: Create deployment archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.env \
            -czf laravel.tar.gz .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel
          path: laravel.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - tap
          - woc
          - oaa
          - toc
          - wac

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: laravel.tar.gz
          target: "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

            cd "$APP_DIR"

            echo "Extracting application..."
            tar -xzf laravel.tar.gz
            rm -f laravel.tar.gz

            echo "Installing Composer dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo "Running Laravel optimization..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Deployment completed for ${{ matrix.app }}"
