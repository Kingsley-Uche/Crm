name: Laravel Build & Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BASE_DEPLOY_PATH: /home2/netporta/public_html/dwello.netportal.com.ng

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring,pdo,xml,bcmath,fileinfo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Packages
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Create Deployment Archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=tests \
            --exclude=storage \
            --exclude=bootstrap/cache/*.php \
            --exclude=.env \
            -czf laravel.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel
          path: laravel.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - tap
          - woc
          - oaa
          - toc
          - wac

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel

      - name: Upload Archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: laravel.tar.gz
          target: "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Put application into maintenance mode if it already exists
            if [ -f artisan ]; then
              php artisan down || true
            fi

            echo "Extracting application..."
            tar -xzf laravel.tar.gz
            rm -f laravel.tar.gz

            # Ensure persistent directories exist
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            chmod -R 775 storage bootstrap/cache || true

            echo "Installing Composer dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            php artisan optimize:clear

            php artisan optimize

            php artisan up || true

            echo "Deployment completed for ${{ matrix.app }}"
