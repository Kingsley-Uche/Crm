name: Laravel Build & Deploy to cPanel

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo, xml, bcmath, fileinfo, openssl

      # 3. Validate Composer
      - name: Validate composer.json
        run: composer validate --strict

      # 4. Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # 5. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 6. Install Node dependencies
      - name: Install NPM dependencies
        run: npm ci

      # 7. Build Vite assets (CRITICAL FIX)
      - name: Build frontend assets
        run: npm run build

      # 8. Debug (IMPORTANT - prevents silent failures)
      - name: Verify build exists
        run: ls -la public/build

      # 9. Upload Vite build to server (FIXED PATH)
      - name: Upload build folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/"
          target: ${{secrets.DEPLOY_PATH }}

      # 10. Deploy backend via SSH
      - name: Deploy Laravel backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home2/netporta/repositories/estate_manager

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "Clearing Laravel cache..."
            php artisan optimize:clear
            echo "running migrations"
            php artisan migrate --force
            echo "Deployment complete!"
