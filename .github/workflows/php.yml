name: Laravel Build & Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - tap
          - woc
          - oaa
          - toc
          - wac

    env:
      BASE_DEPLOY_PATH: /home2/netporta/public_html/dwello.netportal.com.ng

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, xml, bcmath, fileinfo, openssl

      # Validate Composer
      - name: Validate composer.json
        run: composer validate --strict

      # Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install NPM dependencies
      - name: Install NPM dependencies
        run: npm ci

      # Build frontend assets
      - name: Build frontend assets
        run: npm run build

      # Verify build
      - name: Verify build exists
        run: ls -la public/build

      # Upload Laravel project
      - name: Upload application to ${{ matrix.app }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          source: |
            ./*
            !.git
            !.github
            !node_modules
            !tests
            !storage
            !bootstrap/cache
            !.env

          target: "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"
          overwrite: true
          rm: false

      # Finalize deployment
      - name: Optimize Laravel (${{ matrix.app }})
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "${{ env.BASE_DEPLOY_PATH }}/${{ matrix.app }}"

            echo "Installing Composer dependencies..."
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            echo "Clearing caches..."
            php artisan optimize:clear

            echo "Caching configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Running migrations..."
            php artisan migrate --force

            echo "Deployment completed for ${{ matrix.app }}."
